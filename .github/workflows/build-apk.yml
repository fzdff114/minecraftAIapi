          s=s.replace("import java.io.FileOutputStream\n","")
          s=s.replace("              private lateinit var skinPreview: ImageView\n","")

          fields = """              private lateinit var pageHost: FrameLayout
              private lateinit var homePage: ScrollView
              private lateinit var serverPage: ScrollView
              private lateinit var aiPage: ScrollView
              private lateinit var behaviorPage: ScrollView
              private lateinit var logsPage: ScrollView
              private var accountAuthenticated = false

          """
          if "private lateinit var pageHost: FrameLayout" not in s:
              field_pos = s.find("private lateinit var chatInput: EditText")
              if field_pos < 0: raise SystemExit("MainActivity chat input field not found")
              field_end = s.find("\\n", field_pos)
              if field_end < 0: raise SystemExit("MainActivity field line ending not found")
              s = s[:field_end + 1] + fields + s[field_end + 1:]

          start=s.find("private fun buildUi()")
          end=s.find("private fun card(",start if start>=0 else 0)
          if start<0 or end<0: raise SystemExit("MainActivity buildUi/card boundaries missing")
          start=s.rfind("\n",0,start)+1
          end=s.rfind("\n",0,end)+1
          ui = r'''
              private fun buildUi() {
                  window.statusBarColor = Color.rgb(12, 25, 40)
                  window.navigationBarColor = Color.rgb(8, 17, 29)
                  pageHost = FrameLayout(this).apply { setBackgroundColor(Color.rgb(9, 17, 29)) }
                  setContentView(pageHost)
                  homePage = buildMainMenu()
                  serverPage = buildServerPage()
                  aiPage = buildAiPage()
                  behaviorPage = buildBehaviorPage()
                  logsPage = buildLogsPage()
                  showPage(homePage)
              }

              private fun showPage(page: ScrollView) {
                  pageHost.removeAllViews()
                  pageHost.addView(page, FrameLayout.LayoutParams(-1, -1))
              }

              private fun buildMainMenu(): ScrollView {
                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(Color.rgb(9, 17, 29))
                  }
                  val frame = FrameLayout(this).apply {
                      minimumHeight = resources.displayMetrics.heightPixels
                  }
                  scroll.addView(frame, ScrollView.LayoutParams(-1, -2))

                  val background = View(this).apply {
                      background = android.graphics.drawable.GradientDrawable(
                          android.graphics.drawable.GradientDrawable.Orientation.TL_BR,
                          intArrayOf(0xFF0D2237.toInt(), 0xFF203B54.toInt(), 0xFF101A2A.toInt(), 0xFF0A1422.toInt())
                      )
                  }
                  frame.addView(background, FrameLayout.LayoutParams(-1, -1))
                  frame.addView(View(this).apply {
                      setBackgroundColor(0x78081320)
                  }, FrameLayout.LayoutParams(-1, -1))

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(22), dp(18), dp(28))
                  }
                  frame.addView(content, FrameLayout.LayoutParams(-1, -2, Gravity.TOP))

                  val logo = ImageView(this).apply {
                      adjustViewBounds = true
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      try {
                          assets.open("minecraft/menu_logo_small.webp").use { input ->
                              setImageBitmap(BitmapFactory.decodeStream(input))
                          }
                      } catch (_: Exception) {}
                  }
                  content.addView(logo, LinearLayout.LayoutParams(-1, dp(76)))
                  addText(content, "方块伙伴 AI 2.0", 23f, true, Color.WHITE)
                  addText(content, "Minecraft Bedrock · 独立 AI 玩家", 13f, false, 0xFFE2E8F0.toInt())

                  val account = card(content, "Microsoft / Xbox 账号")
                  accountStatus = addText(account, "正在自动登录 Microsoft 账号…", 17f, true, Color.WHITE)
                  accountDetails = addText(account, "首次打开会直接弹出 Microsoft 官方授权页面；已有有效登录缓存则自动恢复。无需先配置服务器。", 12f, false, 0xFFD4DFEC.toInt())
                  serviceStatus = addText(account, "后台服务启动中…", 12f, false, 0xFFB8C9DA.toInt())
                  val loginRow = row(account)
                  addButton(loginRow, "重新登录 / 切换账号", false) { clearXboxCache() }
                  addButton(loginRow, "刷新状态", false) { refreshState() }

                  val menu = card(content, "开始")
                  addMenuButton(menu, "开始游戏 · 选择服务器", true) { showPage(serverPage) }
                  addMenuButton(menu, "角色更衣室 · 使用 Minecraft 原生界面", false) { openMinecraftProfile() }
                  addMenuButton(menu, "AI 玩家与聊天日志", false) { showPage(logsPage) }
                  addMenuButton(menu, "AI 服务设置", false) { showPage(aiPage) }
                  addMenuButton(menu, "AI 行为设置", false) { showPage(behaviorPage) }

                  val footer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(18), 0, 0)
                  }
                  content.addView(footer)
                  addText(footer, "连接方式：Bedrock 1.26.60 · RakNet / NetherNet", 11f, false, 0xFFD0DBE8.toInt())
                  addText(footer, "皮肤、披风和角色切换由 Minecraft 原生 Persona Dressing Room 管理。", 11f, false, 0xFFD0DBE8.toInt())
                  return scroll
              }

              private fun buildServerPage(): ScrollView {
                  val (scroll, root) = createSolidPage("游戏连接")
                  gameStatus = addText(root, "等待 Microsoft 登录", 14f, true, 0xFFBAE6FD.toInt())
                  modeSpinner = addSpinner(root, arrayOf("服务器 IP / 端口", "Xbox 好友世界", "Realm"))
                  hostInput = addEdit(root, "服务器地址 / IP", "127.0.0.1")
                  val rowFields = row(root)
                  portInput = addEdit(rowFields, "UDP 端口", "19132", false, 1f)
                  versionInput = addEdit(rowFields, "Bedrock 版本", "1.26.60", false, 1f)
                  usernameInput = addEdit(root, "AI 玩家昵称", "BlockmateAI")
                  transportSpinner = addSpinner(root, arrayOf("自动检测（推荐）", "RakNet", "NetherNet"))
                  addText(root, "好友世界和 Realm 使用刚才提前登录的 Xbox 账号；这里仅配置 AI 玩家如何加入，不会再次要求登录。", 12f, false, 0xFF9CAEC2.toInt())
                  val actions = row(root)
                  addButton(actions, "保存连接设置", false) { saveSettings(false) }
                  addButton(actions, "登录并加入世界", true) { connectGame() }
                  addButton(root, "断开 AI 玩家", false) { disconnectGame() }
                  worldsPanel = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(worldsPanel, LinearLayout.LayoutParams(-1, -2))
                  return scroll
              }

              private fun buildAiPage(): ScrollView {
                  val (scroll, root) = createSolidPage("AI 服务设置")
                  apiUrlInput = addEdit(root, "AI API 地址（HTTPS）", "https://api.openai.com/v1")
                  apiKeyInput = addEdit(root, "AI API Key（留空表示保留原密钥）", "", true)
                  modelInput = addEdit(root, "模型名称", "gpt-4.1-mini")
                  val actions = row(root)
                  addButton(actions, "保存设置", true) { saveSettings(false) }
                  addButton(actions, "测试 API", false) { testAi() }
                  addText(root, "Microsoft / Xbox 登录与 AI API 完全分离。Xbox 令牌不会发送给 AI 服务。", 12f, false, 0xFF9CAEC2.toInt())
                  return scroll
              }

              private fun buildBehaviorPage(): ScrollView {
                  val (scroll, root) = createSolidPage("AI 行为")
                  autonomySwitch = addSwitch(root, "自主生存")
                  attackSwitch = addSwitch(root, "攻击敌对生物")
                  collectSwitch = addSwitch(root, "收集掉落物")
                  exploreSwitch = addSwitch(root, "主动探索")
                  eatSwitch = addSwitch(root, "饥饿时进食")
                  addButton(root, "保存行为设置", true) { saveSettings(false) }
                  return scroll
              }

              private fun buildLogsPage(): ScrollView {
                  val (scroll, root) = createSolidPage("AI 玩家与聊天日志")
                  chatInput = addEdit(root, "发送给游戏内 AI 玩家", "")
                  addButton(root, "发送聊天", true) { sendChat() }
                  logsView = addText(root, "等待后台日志…", 12f, false, 0xFFCBD5E1.toInt())
                  addButton(root, "刷新日志", false) { refreshState() }
                  return scroll
              }

              private fun createSolidPage(title: String): Pair<ScrollView, LinearLayout> {
                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      setBackgroundColor(Color.rgb(10, 20, 34))
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(32))
                  }
                  scroll.addView(root)
                  val header = row(root)
                  addButton(header, "返回首页", false) { showPage(homePage) }
                  addText(root, title, 23f, true, Color.WHITE)
                  return Pair(scroll, root)
              }

              private fun addMenuButton(parent: LinearLayout, label: String, primary: Boolean, action: () -> Unit) {
                  val button = Button(this).apply {
                      text = label
                      textSize = 15f
                      isAllCaps = false
                      setTextColor(if (primary) 0xFF14202B.toInt() else Color.WHITE)
                      background = rounded(if (primary) 0xFF70D7B7.toInt() else 0xCC24384E.toInt(), 8, if (primary) 0 else 0xFF8193A8.toInt())
                      setOnClickListener { action() }
                  }
                  val lp = LinearLayout.LayoutParams(-1, dp(54))
                  lp.topMargin = dp(7)
                  parent.addView(button, lp)
              }
          '''
          s=s[:start]+textwrap.dedent(ui)+s[end:]

          # A login is mandatory before joining; the auto-login has already started on app launch.
          if "private var accountAuthenticated = false" not in s:
              raise SystemExit("MainActivity accountAuthenticated field missing")
          auth_marker = 'val auth = value.optJSONObject("authInfo")'
          auth_pos = s.find(auth_marker)
          if auth_pos < 0:
              raise SystemExit("MainActivity authInfo state line not found")
          auth_line_end = s.find("\n", auth_pos)
          auth_line_start = s.rfind("\n", 0, auth_pos) + 1
          indent = s[auth_line_start:auth_pos]
          if "accountAuthenticated = auth != null" not in s:
              s = s[:auth_line_end + 1] + indent + 'accountAuthenticated = auth != null && auth.optString("xuid").isNotBlank() && auth.optString("xuid") != "0"\n' + s[auth_line_end + 1:]

          connect_pattern = r'(private fun connectGame\(\)\s*\{\s*)'
          connect_replacement = r'\1if (!accountAuthenticated) { toast("请先完成 Microsoft / Xbox 登录，登录成功后再加入世界。"); return }\n'
          s, connect_count = re.subn(connect_pattern, connect_replacement, s, count=1)
          if connect_count != 1:
              raise SystemExit("MainActivity connectGame function not found")

          # After clearing credentials, restart the embedded agent; its startup now immediately signs in again.
          clear_start = s.find("private fun clearXboxCache()")
          clear_end = s.find("private fun updateState(", clear_start if clear_start >= 0 else 0)
          if clear_start < 0 or clear_end < 0:
              raise SystemExit("MainActivity account switch function not found")
          clear_block = s[clear_start:clear_end]
          if "AgentService.ACTION_RESTART" not in clear_block:
              marker = 'accountDetails.text = "下次连接时会重新打开 Microsoft 官方授权页面。"'
              if marker not in clear_block:
                  raise SystemExit("Account switch status line not found")
              clear_block = clear_block.replace(marker, marker + '\n                                  accountAuthenticated = false\n                                  val restart = Intent(this, AgentService::class.java).setAction(AgentService.ACTION_RESTART)\n                                  ContextCompat.startForegroundService(this, restart)', 1)
              s = s[:clear_start] + clear_block + s[clear_end:]

          # Drop the app-side custom PNG picker; invoke Minecraft's own Persona Dressing Room via its official deep link.
          skin_start=s.find("private fun chooseSkin()")
          skin_end=s.find("private fun api(", skin_start if skin_start>=0 else 0)
          if skin_start>=0 and skin_end>skin_start:
              skin_start=s.rfind("\n",0,skin_start)+1
              skin_end=s.rfind("\n",0,skin_end)+1
              s=s[:skin_start]+s[skin_end:]
          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BlockmateAI-Android/agent/package.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 and build utilities
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y libarchive-tools curl

      - name: Install, test and compile Bedrock agent
        working-directory: BlockmateAI-Android/agent
        run: |
          npm install
          npm test
          npm run build
          npm prune --omit=dev

      - name: Exclude bundled test fixture files
        working-directory: BlockmateAI-Android
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/prepare-agent.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const needle = "filter: source => !source.split(path.sep).includes('.bin')";
          const patched = "filter: source => { const parts = source.split(path.sep); return !parts.includes('.bin') && !(parts.includes('prismarine-nbt') && parts.includes('sample')); }";
          if (!source.includes(needle)) throw new Error('未找到资源复制过滤器，停止构建');
          source = source.replace(needle, patched);
          fs.writeFileSync(file, source);
          NODE

      - name: Package agent assets
        working-directory: BlockmateAI-Android
        run: |
          node tools/prepare-agent.mjs
          test -s app/src/main/assets/agent/node_modules/minecraft-data/minecraft-data/data/pc/common/features.json
          test -s app/src/main/assets/agent/node_modules/minecraft-data/minecraft-data/data/bedrock/common/features.json
          # The native Android app no longer ships or loads the old HTML dashboard.
          rm -rf app/src/main/assets/agent/public
          # Strip non-runtime files from the packaged production dependencies.
          find app/src/main/assets/agent/node_modules -type d \( -name .git -o -name .github -o -name test -o -name tests -o -name __tests__ -o -name docs -o -name examples -o -name example -o -name coverage -o -name benchmarks -o -name benchmark \) -prune -exec rm -rf {} +
          find app/src/main/assets/agent -type f \( -name '*.map' -o -name '*.ts' -o -name '*.d.ts' -o -name '*.flow' -o -name '*.md' -o -name '*.markdown' -o -name '*.mdx' -o -name '*.spec.js' -o -name '*.test.js' \) -delete
          echo 'Packaged agent assets after pruning:'
          du -sh app/src/main/assets/agent app/src/main/assets/agent/node_modules

      - name: Bundle ARM64 Node runtime
        working-directory: BlockmateAI-Android
        run: |
          mkdir -p tools/vendor tools/bin
          curl -fsSL https://raw.githubusercontent.com/LinMiZe/NodeJsBox/main/tools/fetch-termux-deps.cjs -o tools/vendor/fetch-termux-deps.cjs
          curl -fsSL https://raw.githubusercontent.com/LinMiZe/NodeJsBox/main/tools/assemble-runtime.cjs -o tools/vendor/assemble-runtime.cjs
          # The upstream helper has Windows-style .\\ paths; normalize them for the Linux runner.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/vendor/assemble-runtime.cjs")
          s = p.read_text()
          needle = r"""runTar(['-xf', '.\\' + path.basename(dataTar)], workDir);"""
          replacement = "runTar(['-xf', path.basename(dataTar)], workDir);"
          if needle not in s:
              raise SystemExit("未找到需要修正的 Linux 解包路径，停止构建以避免生成错误运行时")
          s = s.replace(needle, replacement)
          deb_needle = r"""runTar(['-xf', '.\\' + path.basename(deb)], workDir);"""
          s = s.replace(deb_needle, "runTar(['-xf', path.basename(deb)], workDir);")
          p.write_text(s)
          PY
          ln -sf "$(command -v bsdtar)" tools/bin/tar
          export PATH="$PWD/tools/bin:$PATH"
          node tools/vendor/fetch-termux-deps.cjs --arch aarch64 --with-node
          node tools/vendor/assemble-runtime.cjs --arch aarch64

      - name: Enable Android BuildConfig generation
        working-directory: BlockmateAI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          anchor = "    compileSdk 35"
          if "buildFeatures { buildConfig true }" not in s:
              if anchor not in s:
                  raise SystemExit("未找到 compileSdk 配置，停止构建")
              s = s.replace(anchor, anchor + chr(10) + chr(10) + "    buildFeatures { buildConfig true }", 1)
              p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: BlockmateAI-Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: |
          test -s BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockmateAI-2.0-alpha.13-arm64-debug-apk
          path: BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blockmate-ai-2.0-alpha.13-public-20261102
          name: Blockmate AI 2.0 alpha.13 APK (Public Download)
          draft: false
          prerelease: true
          files: BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
