              private fun updateState(value: JSONObject) {
                  gameStatus.text = value.optString("status", "等待连接")
                  val auth = value.optJSONObject("authInfo")
                  if (auth != null) {
                      val tag = auth.optString("gamertag", value.optString("botName", "Xbox 玩家"))
                      accountStatus.text = "Xbox 已登录：" + tag
                      val lines = arrayOf(
                          "平台：" + auth.optString("platform", "Android") + " · Title ID：" + auth.optString("titleId", "0000000048183522"),
                          "Gamertag：" + tag,
                          "XUID：" + auth.optString("xuid", "读取中"),
                          "UUID：" + auth.optString("uuid", "已认证"),
                          "XSTS：" + if (auth.optString("expiresAt").isNotBlank()) "已获取" else "等待中",
                          "Bedrock 身份链：" + if (auth.optBoolean("bedrockChainReady")) "已载入" else "等待中",
                          "多人凭据：" + if (auth.optBoolean("multiplayerTokenReady")) "已载入" else "等待中"
                      )
                      accountDetails.text = lines.joinToString("\n")
                  } else if (value.optJSONObject("deviceCode") != null) {
                      accountStatus.text = "等待 Microsoft 官方授权"
                      accountDetails.text = "请在 Microsoft 页面输入登录代码并完成 Xbox 登录。"
                  }

                  val code = value.optJSONObject("deviceCode")
                  if (code != null) {
                      val userCode = code.optString("userCode")
                      if (userCode.isNotBlank() && userCode != lastDeviceCode) {
                          lastDeviceCode = userCode
                          showMicrosoftCode(userCode, code.optString("verificationUri", "https://www.microsoft.com/link"))
                      }
                  } else {
                      lastDeviceCode = ""
                  }

                  renderWorlds(value.optJSONArray("worlds") ?: JSONArray())
                  val lines = ArrayList<String>()
                  val sys = value.optJSONArray("systemLogs") ?: JSONArray()
                  for (i in maxOf(0, sys.length() - 8) until sys.length()) lines.add(sys.optString(i))
                  val chat = value.optJSONArray("logs") ?: JSONArray()
                  for (i in maxOf(0, chat.length() - 6) until chat.length()) {
                      val item = chat.optJSONObject(i) ?: continue
                      lines.add(item.optString("sender") + ": " + item.optString("message"))
                  }
                  logsView.text = lines.joinToString("\n").ifBlank { "尚无运行日志" }
              }

              private fun showMicrosoftCode(code: String, link: String) {
                  runOnUiThread {
                      val safeLink = if (isMicrosoftUrl(link)) link else "https://www.microsoft.com/link"
                      AlertDialog.Builder(this)
                          .setTitle("Microsoft 官方账号授权")
                          .setMessage("登录代码：\n\n" + code + "\n\n点击打开 Microsoft 官方页面，在页面中输入代码并完成 Xbox 登录。")
                          .setPositiveButton("打开 Microsoft 登录页面") { _, _ -> openMicrosoftPage(safeLink) }
                          .setNeutralButton("复制登录代码") { _, _ ->
                              val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as android.content.ClipboardManager
                              clipboard.setPrimaryClip(android.content.ClipData.newPlainText("Microsoft device code", code))
                              toast("登录代码已复制")
                          }
                          .setNegativeButton("稍后", null)
                          .show()
                      openMicrosoftPage(safeLink)
                  }
              }

              private fun isMicrosoftUrl(raw: String): Boolean {
                  return try {
                      val uri = Uri.parse(raw)
                      val host = uri.host?.lowercase() ?: return false
                      uri.scheme == "https" && (host == "microsoft.com" || host.endsWith(".microsoft.com") ||
                          host == "live.com" || host.endsWith(".live.com") || host == "aka.ms")
                  } catch (_: Exception) { false }
              }

              private fun openMicrosoftPage(url: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                  } catch (e: Exception) {
                      toast("无法打开 Microsoft 页面：" + (e.message ?: "未知错误"))
                  }
              }

              private fun renderWorlds(worlds: JSONArray) {
