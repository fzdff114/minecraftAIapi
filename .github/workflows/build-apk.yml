name: Build Blockmate AI Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded Android source archive
        run: |
          unzip -q BlockmateAI-2.0-alpha.4-current.zip
          test -f BlockmateAI-Android/settings.gradle
          test -f BlockmateAI-Android/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: BlockmateAI-Android/agent/package.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and build utilities
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y libarchive-tools curl

      - name: Install, test and compile Bedrock agent
        working-directory: BlockmateAI-Android/agent
        run: |
          npm install
          npm test
          npm run build
          npm prune --omit=dev

      - name: Package agent assets
        working-directory: BlockmateAI-Android
        run: node tools/prepare-agent.mjs

      - name: Bundle ARM64 Node runtime
        working-directory: BlockmateAI-Android
        run: bash tools/prepare-runtime.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: BlockmateAI-Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: |
          test -s BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockmateAI-2.0-alpha.4-arm64-debug-apk
          path: BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
