      - name: Apply Minecraft 1.19 title-screen layout and sign in before server setup
        working-directory: BlockmateAI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          # Copy only the original Minecraft Bedrock title logo from the supplied 1.19 APK.
          # No 1.19 gameplay, protocol, multiplayer, network, or world code/assets are copied.
          assets_dir = Path("app/src/main/assets/minecraft")
          assets_dir.mkdir(parents=True, exist_ok=True)
          logo_source = Path("../menu_logo_small.webp")
          if not logo_source.is_file():
              raise SystemExit("Minecraft Bedrock menu logo asset missing")
          (assets_dir / "menu_logo_small.webp").write_bytes(logo_source.read_bytes())

          # Add a Microsoft/Xbox-only pre-login. It uses the exact same Authflow cache directory
          # as the later Bedrock connection, so the server page is not required to sign in.
          p = Path("agent/src/bedrock-transport.ts")
          s = p.read_text()
          getter = "  getAuthInfo():XboxAccountInfo|null { return this.authInfo ? {...this.authInfo} : null; }"
          method = r"""
            async authenticateAccount():Promise<XboxAccountInfo> {
              const settings=this.getSettings();
              const authlib=require('prismarine-auth');
              const XboxClient=require('prismarine-xbox-services').XboxClient;
              const flow=new authlib.Authflow(settings.server.username,this.authFolder,{
                flow:'live',
                authTitle:authlib.Titles.MinecraftAndroid,
                deviceType:'Android'
              },(data:any)=>{
                const d={
                  userCode:String(data.user_code ?? data.userCode ?? ''),
                  verificationUri:String(data.verification_uri ?? data.verificationUri ?? 'https://www.microsoft.com/link'),
                  message:String(data.message ?? '')
                };
                this.hooks.deviceCode(d);
                this.hooks.status('请在打开的 Microsoft 官方页面完成账号登录与设备授权。');
              });

              this.hooks.status('正在读取已保存的 Microsoft/Xbox 登录状态…');
              const xsts=await flow.getXboxToken('http://xboxlive.com');
              const profile=await new XboxClient(flow).getProfile('me');
              const expires=new Date(xsts.expiresOn);
              this.actualGamertag=String(profile.gamertag ?? profile.displayName ?? '');
              this.authInfo={
                gamertag:this.actualGamertag,
                uuid:'',
                xuid:String(profile.xuid ?? xsts.userXUID ?? ''),
                userHash:String(xsts.userHash ?? ''),
                titleId:'0000000048183522',
                platform:'Android',
                expiresAt:Number.isNaN(expires.getTime()) ? String(xsts.expiresOn ?? '') : expires.toISOString(),
                bedrockChainReady:false,
                multiplayerTokenReady:false
              };

              // prismarine-auth stores refreshable Microsoft/Xbox tokens in this private cache.
              // Persist only non-secret profile metadata separately; never write raw tokens to the UI or AI API.
              const fs=require('node:fs');
              const path=require('node:path');
              fs.writeFileSync(path.join(this.authFolder,'account-info.json'),JSON.stringify({
                ...this.authInfo,
                displayName:String(profile.displayName ?? ''),
                avatarUrl:String(profile.avatarUrl ?? ''),
                savedAt:new Date().toISOString()
              },null,2),{encoding:'utf8',mode:0o600});

              this.hooks.deviceCode(null);
              this.hooks.status('Microsoft/Xbox 登录成功：' + (this.actualGamertag || '已登录') + '。现在可以选择服务器或好友世界。');
              this.hooks.log('已提前登录 Minecraft Android Xbox 账号：Gamertag=' + this.actualGamertag + '；XUID=' + this.authInfo.xuid);
              return {...this.authInfo};
            }
          """
          if "async authenticateAccount():Promise<XboxAccountInfo>" not in s:
              if getter not in s: raise SystemExit("BedrockTransport getAuthInfo anchor missing")
              s=s.replace(getter,getter+"\n"+textwrap.dedent(method),1)
          p.write_text(s)

          # Trigger account authorization as soon as the local API is listening, before any server settings.
          p = Path("agent/src/main.ts")
          s = p.read_text()
          anchor = "await dashboard.listen(settings.dashboard.port);"
          kickoff = """await dashboard.listen(settings.dashboard.port);
          setTimeout(() => {
            void transport.authenticateAccount().catch((error:any) => {
              status('Microsoft/Xbox 登录失败：' + (error instanceof Error ? error.message : String(error)) + '。可在主界面重新登录。');
            });
          }, 250);"""
          if "transport.authenticateAccount()" not in s:
              if anchor not in s: raise SystemExit("Dashboard startup anchor missing")
              s=s.replace(anchor,kickoff,1)
          p.write_text(s)

          # Rewrite the app's actual home page: Minecraft 1.19 logo + panorama, with real page navigation.
          p = Path("app/src/main/java/com/blockmate/ai/MainActivity.kt")
          s = p.read_text()

          if "import android.widget.FrameLayout" not in s:
              s=s.replace("import android.widget.EditText","import android.widget.EditText\n          import android.widget.FrameLayout",1)
          if "import android.view.View\n" not in s:
              s=s.replace("import android.view.Gravity","import android.view.Gravity\n          import android.view.View",1)

          # Delete the previous custom PNG skin importer; the skin button now opens Minecraft's actual Dressing Room.
          s=s.replace("import android.content.ContentValues\n","")
          s=s.replace("import android.os.Environment\n","")
          s=s.replace("import android.provider.MediaStore\n","")
          s=s.replace("import android.provider.OpenableColumns\n","")
