                  for (i in 0 until worlds.length()) {
                      val item = worlds.optJSONObject(i) ?: continue
                      val index = item.optInt("index", i)
                      val label = item.optString("name", "世界 " + (i + 1))
                      val owner = item.optString("host", "")
                      addButton(worldsPanel, label + if (owner.isNotBlank()) " · " + owner else "", false) {
                          api("POST", "/api/world/select", JSONObject().put("index", index)) { _, error ->
                              if (error != null) toast("选择世界失败：" + error)
                          }
                      }
                  }
              }

