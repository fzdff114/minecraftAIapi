              private val handler = Handler(Looper.getMainLooper())
              private val worker = Executors.newSingleThreadExecutor()
              private var active = true
              private var successHandled = false
              private lateinit var web: WebView
              private lateinit var status: TextView
              private lateinit var codeView: TextView

              private val authPoll = object : Runnable {
                  override fun run() {
                      if (!active || successHandled) return
                      worker.execute {
                          var account: JSONObject? = null
                          var error: String? = null
                          var conn: HttpURLConnection? = null
                          try {
                              conn = (URL(API_ROOT + "/api/state").openConnection() as HttpURLConnection).apply {
                                  requestMethod = "GET"
                                  connectTimeout = 3000
                                  readTimeout = 3000
                                  setRequestProperty("Accept", "application/json")
                                  setRequestProperty("X-Control-Token", CONTROL_TOKEN)
                              }
                              val code = conn.responseCode
                              val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                              val raw = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: "{}"
                              if (code !in 200..299) throw IllegalStateException("本机登录状态接口返回 HTTP " + code)
                              account = JSONObject(raw).optJSONObject("authInfo")
                          } catch (e: Exception) {
                              error = e.message ?: "无法读取登录状态"
                          } finally {
                              conn?.disconnect()
                          }

                          handler.post {
                              if (!active || successHandled) return@post
                              val xuid = account?.optString("xuid", "") ?: ""
                              val gamertag = account?.optString("gamertag", "") ?: ""
                              if (xuid.isNotBlank() && xuid != "0" && gamertag.isNotBlank()) {
                                  successHandled = true
                                  status.text = "Xbox 登录成功\nGamertag：" + gamertag + "\nXUID：" + xuid
                                  web.stopLoading()
                                  handler.postDelayed({
                                      setResult(Activity.RESULT_OK)
                                      finish()
                                  }, 1400)
                              } else {
                                  if (error != null && status.text.toString().startsWith("正在等待")) {
                                      status.text = "正在等待 Microsoft 授权完成…\n" + error
                                  }
                                  handler.postDelayed(this, 1600)
                              }
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(12, 25, 40)
                  window.navigationBarColor = Color.rgb(8, 17, 29)

                  val code = intent.getStringExtra("microsoft_code").orEmpty()
                  val supplied = intent.getStringExtra("verification_uri").orEmpty()
