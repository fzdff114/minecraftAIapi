name: Build Blockmate AI Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix agent data extraction, launch Microsoft OAuth page, and auto-start backend
        working-directory: BlockmateAI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Preserve the packaged minecraft-data data tree when copying assets into app storage.
          p = Path("app/src/main/java/com/blockmate/ai/AgentService.kt")
          s = p.read_text()
          old = 'if (childAsset.contains("/data/")) continue'
          new = 'if (childAsset == "agent/data" || childAsset.startsWith("agent/data/")) continue'
          if old not in s:
              raise SystemExit("AgentService 数据目录过滤规则未匹配，停止构建")
          p.write_text(s.replace(old, new, 1))

          # Launch backend automatically and prevent stale dashboard pages when backend is gone.
          p = Path("app/src/main/java/com/blockmate/ai/MainActivity.kt")
          s = p.read_text()
          if "import android.webkit.JavascriptInterface" not in s:
              s = s.replace("import android.webkit.WebChromeClient", "import android.webkit.JavascriptInterface\\nimport android.webkit.WebChromeClient", 1)
          old = """        if (AgentService.isBackendAlive) loadDashboard() else showWelcome()
          startStatusPolling()"""
          new = """        if (AgentService.isBackendAlive) loadDashboard() else {
              showWelcome()
              startAgent(silent = true)
          }
          startStatusPolling()"""
          if old not in s:
              raise SystemExit("MainActivity 自动启动位置未匹配，停止构建")
          s = s.replace(old, new, 1)
          s = s.replace("    private fun startAgent() {", "    private fun startAgent(silent: Boolean = false) {", 1)
          s = s.replace('            toast("正在启动 AI 服务")', '            if (!silent) toast("正在启动 AI 服务")', 1)

          marker = "            webChromeClient = WebChromeClient()"
          bridge = """            webChromeClient = WebChromeClient()
                      settings.javaScriptCanOpenWindowsAutomatically = true
                      addJavascriptInterface(object {
                          @JavascriptInterface
                          fun openMicrosoftLogin(rawUrl: String) {
                              try {
                                  val uri = Uri.parse(rawUrl)
                                  val host = uri.host?.lowercase() ?: return
                                  val microsoftHost = host == "microsoft.com" || host.endsWith(".microsoft.com") ||
                                      host == "live.com" || host.endsWith(".live.com") || host == "aka.ms"
                                  if (uri.scheme == "https" && microsoftHost) {
                                      runOnUiThread { openExternal(uri) }
                                  }
                              } catch (_: Exception) { }
                          }
                      }, "AndroidBridge")"""
          if '}, "AndroidBridge")' not in s:
              if marker not in s:
                  raise SystemExit("WebView 初始化位置未匹配，停止构建")
              s = s.replace(marker, bridge, 1)

          old = """                } else {
                    val error = AgentService.lastError"""
          new = """                } else {
                    if (webView.url?.startsWith(dashboardUrl) == true) showWelcome()
                    val error = AgentService.lastError"""
          if old not in s:
              raise SystemExit("后台停止时清除旧控制面板的位置未匹配，停止构建")
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Keep the app version monotonic so Android replaces old bundled runtime files.
          p = Path("app/build.gradle")
          s = p.read_text()
          if "versionCode 20003" not in s or "versionName '2.0.0-alpha.4'" not in s:
              raise SystemExit("App 版本号不是预期的 alpha.4，停止构建")
          s = s.replace("versionCode 20003", "versionCode 20005", 1)
          s = s.replace("versionName '2.0.0-alpha.4'", "versionName '2.0.0-alpha.6'", 1)
          p.write_text(s)

          # Use the Microsoft device-code flow provided by bedrock-protocol.
          # OnMsaCode is the actual OAuth callback; open its official verification URI once per code.
          p = Path("agent/public/index.html")
          s = p.read_text()
          s = s.replace("2.0.0-alpha.3 · 本机控制台", "2.0.0-alpha.6 · 本机控制台")
          old_state = "let settings=null,lastChatCount=0,lastLogs='';"
          new_state = "let settings=null,lastChatCount=0,lastLogs='',lastOpenedMicrosoftCode='';"
          if old_state not in s:
              raise SystemExit("Dashboard 状态变量未匹配，停止构建")
          s = s.replace(old_state, new_state, 1)

          old_api = """async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-control-token':TOKEN},body:JSON.stringify(body??{})});const j=await r.json();if(!r.ok)throw new Error(j.error??'请求失败');return j;}"""
          new_api = """async function api(path,body){let r;try{r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-control-token':TOKEN},body:JSON.stringify(body??{})});}catch(e){throw new Error('内置 AI 服务未连接。请等待顶部显示“控制面板已就绪”后，再开始登录。');}let j;try{j=await r.json();}catch(e){throw new Error('本机控制服务返回了无效响应，请刷新或重新启动 AI 服务。');}if(!r.ok)throw new Error(j.error??'请求失败');return j;}"""
          if old_api not in s:
              raise SystemExit("Dashboard API 函数未匹配，停止构建")
          s = s.replace(old_api, new_api, 1)

          old_code = """if(s.deviceCode){$('deviceCode').style.display='block';$('verifyLink').href=s.deviceCode.verificationUri||'https://microsoft.com/link';$('codeValue').textContent=s.deviceCode.userCode||'';$('codeMessage').textContent=s.deviceCode.message||'在微软登录页面输入上方代码。'}else $('deviceCode').style.display='none';"""
          new_code = """if(s.deviceCode){
            $('deviceCode').style.display='block';
            const microsoftUrl=s.deviceCode.verificationUri||'https://www.microsoft.com/link';
            const microsoftCode=s.deviceCode.userCode||'';
            $('verifyLink').href=microsoftUrl;
            $('verifyLink').textContent='打开微软官方账号授权页面';
            $('codeValue').textContent=microsoftCode;
            $('codeMessage').textContent='正在调用 Microsoft/Xbox 官方设备授权。请在微软页面登录并输入上方代码；账号密码只在微软官方页面填写。';
            if(microsoftCode && microsoftCode!==lastOpenedMicrosoftCode){
              lastOpenedMicrosoftCode=microsoftCode;
              if(window.AndroidBridge && window.AndroidBridge.openMicrosoftLogin){
                window.AndroidBridge.openMicrosoftLogin(microsoftUrl);
              } else {
                window.location.assign(microsoftUrl);
              }
            }
          }else{
            $('deviceCode').style.display='none';
            lastOpenedMicrosoftCode='';
          }"""
          if old_code not in s:
              raise SystemExit("Dashboard 微软设备码显示逻辑未匹配，停止构建")
          s = s.replace(old_code, new_code, 1)

          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: BlockmateAI-Android/agent/package.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35 and build utilities
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y libarchive-tools curl

      - name: Install, test and compile Bedrock agent
        working-directory: BlockmateAI-Android/agent
        run: |
          npm install
          npm test
          npm run build
          npm prune --omit=dev

      - name: Exclude bundled test fixture files
        working-directory: BlockmateAI-Android
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tools/prepare-agent.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const needle = "filter: source => !source.split(path.sep).includes('.bin')";
          const patched = "filter: source => { const parts = source.split(path.sep); return !parts.includes('.bin') && !(parts.includes('prismarine-nbt') && parts.includes('sample')); }";
          if (!source.includes(needle)) throw new Error('未找到资源复制过滤器，停止构建');
          source = source.replace(needle, patched);
          fs.writeFileSync(file, source);
          NODE

      - name: Package agent assets
        working-directory: BlockmateAI-Android
        run: |
          node tools/prepare-agent.mjs
          test -s app/src/main/assets/agent/node_modules/minecraft-data/minecraft-data/data/pc/common/features.json
          test -s app/src/main/assets/agent/node_modules/minecraft-data/minecraft-data/data/bedrock/common/features.json

      - name: Bundle ARM64 Node runtime
        working-directory: BlockmateAI-Android
        run: |
          mkdir -p tools/vendor tools/bin
          curl -fsSL https://raw.githubusercontent.com/LinMiZe/NodeJsBox/main/tools/fetch-termux-deps.cjs -o tools/vendor/fetch-termux-deps.cjs
          curl -fsSL https://raw.githubusercontent.com/LinMiZe/NodeJsBox/main/tools/assemble-runtime.cjs -o tools/vendor/assemble-runtime.cjs
          # The upstream helper has Windows-style .\\ paths; normalize them for the Linux runner.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/vendor/assemble-runtime.cjs")
          s = p.read_text()
          needle = r"""runTar(['-xf', '.\\' + path.basename(dataTar)], workDir);"""
          replacement = "runTar(['-xf', path.basename(dataTar)], workDir);"
          if needle not in s:
              raise SystemExit("未找到需要修正的 Linux 解包路径，停止构建以避免生成错误运行时")
          s = s.replace(needle, replacement)
          deb_needle = r"""runTar(['-xf', '.\\' + path.basename(deb)], workDir);"""
          s = s.replace(deb_needle, "runTar(['-xf', path.basename(deb)], workDir);")
          p.write_text(s)
          PY
          ln -sf "$(command -v bsdtar)" tools/bin/tar
          export PATH="$PWD/tools/bin:$PATH"
          node tools/vendor/fetch-termux-deps.cjs --arch aarch64 --with-node
          node tools/vendor/assemble-runtime.cjs --arch aarch64

      - name: Enable Android BuildConfig generation
        working-directory: BlockmateAI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          anchor = "    compileSdk 35"
          if "buildFeatures { buildConfig true }" not in s:
              if anchor not in s:
                  raise SystemExit("未找到 compileSdk 配置，停止构建")
              s = s.replace(anchor, anchor + chr(10) + chr(10) + "    buildFeatures { buildConfig true }", 1)
              p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: BlockmateAI-Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK output
        run: |
          test -s BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockmateAI-2.0-alpha.6-arm64-debug-apk
          path: BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blockmate-ai-2.0-alpha.6-public-20261101
          name: Blockmate AI 2.0 alpha.6 APK (Public Download)
          draft: false
          prerelease: true
          files: BlockmateAI-Android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
