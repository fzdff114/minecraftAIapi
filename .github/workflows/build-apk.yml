              private fun isMicrosoftHttpsUrl(raw: String): Boolean {
                  return try {
                      val uri = Uri.parse(raw)
                      val host = uri.host?.lowercase() ?: return false
                      if (uri.scheme != "https") return false
                      val allowed = listOf(
                          "microsoft.com", "microsoftonline.com", "live.com", "live.net",
                          "msauth.net", "msftauth.net", "msftauthimages.net", "xbox.com",
                          "xboxlive.com", "xboxservices.com", "aka.ms"
                      )
                      allowed.any { host == it || host.endsWith("." + it) }
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()

              override fun onDestroy() {
                  active = false
                  handler.removeCallbacksAndMessages(null)
                  if (::web.isInitialized) {
                      web.stopLoading()
                      web.destroy()
                  }
                  worker.shutdownNow()
                  super.onDestroy()
              }
          }
