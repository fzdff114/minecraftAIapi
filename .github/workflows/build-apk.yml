              private fun chooseSkin() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "image/png"
                  }
                  startActivityForResult(intent, REQUEST_SKIN)
              }

              @Deprecated("Use Activity Result API after project migration")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != REQUEST_SKIN || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  io.execute {
                      try {
                          val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, options) }
                          val valid = (options.outWidth == 64 && (options.outHeight == 64 || options.outHeight == 32)) ||
                              (options.outWidth == 128 && options.outHeight == 128)
                          if (!valid) throw IllegalArgumentException("PNG 尺寸需为 64×64、64×32 或 128×128")
                          val name = queryDisplayName(uri) ?: "custom_skin.png"
                          val safe = name.replace(Regex("[^A-Za-z0-9._-]"), "_").let {
                              if (it.endsWith(".png", true)) it else it + ".png"
                          }
                          val location = saveSkinToDownloads(uri, safe)
                          runOnUiThread {
                              try {
                                  contentResolver.openInputStream(uri)?.use { input ->
                                      skinPreview.setImageBitmap(BitmapFactory.decodeStream(input))
                                      skinPreview.visibility = android.view.View.VISIBLE
                                  }
                              } catch (_: Exception) {}
                              toast("皮肤已保存：" + location)
                              openMinecraftProfile()
                          }
                      } catch (e: Exception) {
                          runOnUiThread { toast(e.message ?: "导入皮肤失败") }
                      }
                  }
              }

              private fun queryDisplayName(uri: Uri): String? {
                  return contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { cursor ->
                      if (cursor.moveToFirst()) cursor.getString(0) else null
                  }
              }

              private fun saveSkinToDownloads(uri: Uri, name: String): String {
                  if (Build.VERSION.SDK_INT >= 29) {
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, name)
                          put(MediaStore.Downloads.MIME_TYPE, "image/png")
                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/BlockmateAI/Skins")
                          put(MediaStore.Downloads.IS_PENDING, 1)
                      }
                      val target = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          ?: throw IllegalStateException("无法创建下载文件")
                      try {
                          val output = contentResolver.openOutputStream(target) ?: throw IllegalStateException("无法写入文件")
                          output.use { out ->
                              val input = contentResolver.openInputStream(uri) ?: throw IllegalStateException("无法读取皮肤文件")
                              input.use { it.copyTo(out) }
                          }
                          val ready = ContentValues().apply { put(MediaStore.Downloads.IS_PENDING, 0) }
                          contentResolver.update(target, ready, null, null)
                      } catch (e: Exception) {
                          contentResolver.delete(target, null, null)
                          throw e
                      }
                      return "Download/BlockmateAI/Skins/" + name
                  }
                  val dir = File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "Skins")
                  if (!dir.exists() && !dir.mkdirs()) throw IllegalStateException("无法创建皮肤目录")
                  val file = File(dir, name)
                  val input = contentResolver.openInputStream(uri) ?: throw IllegalStateException("无法读取皮肤文件")
                  input.use { source -> FileOutputStream(file).use { source.copyTo(it) } }
                  return file.absolutePath
              }

              private fun api(
                  method: String,
                  path: String,
                  body: JSONObject?,
                  timeoutMs: Int = 12000,
                  silent: Boolean = false,
                  callback: (JSONObject?, String?) -> Unit
              ) {
                  io.execute {
                      var conn: HttpURLConnection? = null
                      try {
                          conn = (URL(API_ROOT + path).openConnection() as HttpURLConnection).apply {
                              requestMethod = method
                              connectTimeout = 7000
                              readTimeout = timeoutMs
                              setRequestProperty("Accept", "application/json")
                              setRequestProperty("X-Control-Token", CONTROL_TOKEN)
                              if (body != null) {
                                  doOutput = true
                                  setRequestProperty("Content-Type", "application/json; charset=utf-8")
                              }
                          }
                          if (body != null) conn.outputStream.use {
                              it.write(body.toString().toByteArray(Charsets.UTF_8))
                          }
                          val code = conn.responseCode
                          val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                          val raw = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: "{}"
                          val result = JSONObject(raw)
                          if (code !in 200..299) throw IllegalStateException(result.optString("error", "HTTP " + code))
                          runOnUiThread { callback(result, null) }
                      } catch (e: Exception) {
                          val message = e.message ?: "本机控制接口暂不可用"
                          runOnUiThread { callback(null, message) }
                      } finally {
                          conn?.disconnect()
                      }
                  }
              }

