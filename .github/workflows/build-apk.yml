              login_method = """  async login():Promise<XboxAccountInfo> {
                if (this.authInfo?.xuid && this.authInfo.gamertag) return {...this.authInfo};
                const authlib=require('prismarine-auth');
                const crypto=require('node:crypto');
                const settings=this.getSettings();
                this.hooks.status('正在启动 Minecraft Android 的 Microsoft / Xbox 登录…');
                this.authflow ??= new authlib.Authflow(settings.server.username,this.authFolder,{
                  flow:'live',
                  authTitle:authlib.Titles.MinecraftAndroid,
                  deviceType:'Android'
                },(data:any)=>{
                  const d:DeviceCode={
                    userCode:String(data.user_code ?? data.userCode ?? ''),
                    verificationUri:String(data.verification_uri ?? data.verificationUri ?? 'https://www.microsoft.com/link'),
                    message:String(data.message ?? '')
                  };
                  this.hooks.deviceCode(d);
                  this.hooks.status('请在 Microsoft 官方页面完成账号授权，登录代码：'+d.userCode);
                });

                // Acquire and cache a full Bedrock token chain before asking the user to configure a server.
                const keyPair=crypto.generateKeyPairSync('ec',{namedCurve:'secp384r1'});
                const bedrockLogin=await this.authflow.getMinecraftBedrockToken(keyPair.publicKey);
                const xsts=await this.authflow.getXboxToken('https://multiplayer.minecraft.net/');
                const chain=Array.isArray(bedrockLogin?.chain)?bedrockLogin.chain:[];
                let profile:any={};
                if(chain[1]) {
                  try {
                    const parts=String(chain[1]).split('.');
                    profile=JSON.parse(Buffer.from(parts[1],'base64url').toString('utf8'));
                  } catch {}
                }
                const extra=profile?.extraData ?? {};
                const expiryValue=xsts?.expiresOn;
                const expiryDate=typeof expiryValue==='number'
                  ? new Date(expiryValue < 100000000000 ? expiryValue*1000 : expiryValue)
                  : new Date(expiryValue);
                this.actualGamertag=String(extra.displayName ?? settings.server.username);
                this.authInfo={
                  gamertag:this.actualGamertag,
                  uuid:String(extra.identity ?? ''),
                  xuid:String(extra.XUID ?? xsts?.userXUID ?? ''),
                  userHash:String(xsts?.userHash ?? ''),
                  titleId:'0000000048183522',
                  platform:'Android',
                  expiresAt:Number.isNaN(expiryDate.getTime()) ? String(expiryValue ?? '') : expiryDate.toISOString(),
                  bedrockChainReady:chain.length>=2,
                  multiplayerTokenReady:Boolean(bedrockLogin?.token)
                };

                // prismarine-auth persists refreshable credentials in its private token cache.
                // Keep only non-secret account metadata in this companion file.
                const fs=require('node:fs');
                const path=require('node:path');
                fs.mkdirSync(this.authFolder,{recursive:true,mode:0o700});
                fs.writeFileSync(path.join(this.authFolder,'account-info.json'),
                  JSON.stringify(this.authInfo,null,2),{mode:0o600});
                this.hooks.deviceCode(null);
                this.hooks.status('Microsoft / Xbox 登录已完成并缓存：'+this.actualGamertag);
                this.hooks.log('已保存 Xbox 身份：Gamertag='+this.authInfo.gamertag+'；XUID='+this.authInfo.xuid+'；Bedrock 链='+this.authInfo.bedrockChainReady+'；多人令牌='+this.authInfo.multiplayerTokenReady);
                return {...this.authInfo};
              }

          """
