name: Build Blockmate AI Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded Android source archive
        run: |
          unzip -q BlockmateAI-2.0-alpha.4-current.zip
          test -f BlockmateAI-Android/settings.gradle
          test -f BlockmateAI-Android/app/build.gradle

      - name: Fix agent data extraction, launch Microsoft OAuth page, and auto-start backend
        working-directory: BlockmateAI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Preserve the packaged minecraft-data data tree when copying assets into app storage.
          p = Path("app/src/main/java/com/blockmate/ai/AgentService.kt")
          s = p.read_text()
          old = 'if (childAsset.contains("/data/")) continue'
          new = 'if (childAsset == "agent/data" || childAsset.startsWith("agent/data/")) continue'
          if old not in s:
              raise SystemExit("AgentService 数据目录过滤规则未匹配，停止构建")
          p.write_text(s.replace(old, new, 1))

          # Launch backend automatically and prevent stale dashboard pages when backend is gone.
          p = Path("app/src/main/java/com/blockmate/ai/MainActivity.kt")
          s = p.read_text()
          if "import android.webkit.JavascriptInterface" not in s:
              s = s.replace("import android.webkit.WebChromeClient", "import android.webkit.JavascriptInterface\nimport android.webkit.WebChromeClient", 1)
          old = "        if (AgentService.isBackendAlive) loadDashboard() else showWelcome()"
          new = """        if (AgentService.isBackendAlive) loadDashboard() else {
              showWelcome()
              startAgent(silent = true)
          }"""
          if old not in s:
              raise SystemExit("MainActivity 自动启动位置未匹配，停止构建")
          s = s.replace(old, new, 1)
          s = s.replace("    private fun startAgent() {", "    private fun startAgent(silent: Boolean = false) {", 1)
          s = s.replace('            toast("正在启动 AI 服务")', '            if (!silent) toast("正在启动 AI 服务")', 1)

          marker = "            webChromeClient = WebChromeClient()"
          bridge = """            webChromeClient = WebChromeClient()
                      settings.javaScriptCanOpenWindowsAutomatically = true
                      addJavascriptInterface(object {
                          @JavascriptInterface
                          fun openMicrosoftLogin(rawUrl: String) {
                              try {
                                  val uri = Uri.parse(rawUrl)
                                  val host = uri.host?.lowercase() ?: return
                                  val microsoftHost = host == "microsoft.com" || host.endsWith(".microsoft.com") ||
                                      host == "live.com" || host.endsWith(".live.com") || host == "aka.ms"
                                  if (uri.scheme == "https" && microsoftHost) {
                                      runOnUiThread { openExternal(uri) }
                                  }
                              } catch (_: Exception) { }
                          }
                      }, "AndroidBridge")"""
          if '}, "AndroidBridge")' not in s:
              if marker not in s:
                  raise SystemExit("WebView 初始化位置未匹配，停止构建")
              s = s.replace(marker, bridge, 1)

          p.write_text(s)

          # Keep the app version monotonic so Android replaces old bundled runtime files.
          p = Path("app/build.gradle")
          s = p.read_text()
          if "versionCode 20003" not in s or "versionName '2.0.0-alpha.4'" not in s:
              raise SystemExit("App 版本号不是预期的 alpha.4，停止构建")
          s = s.replace("versionCode 20003", "versionCode 20012", 1)
          s = s.replace("versionName '2.0.0-alpha.4'", "versionName '2.0.0-alpha.13'", 1)
          p.write_text(s)

          # Use the Microsoft device-code flow provided by bedrock-protocol.
          # OnMsaCode is the actual OAuth callback; open its official verification URI once per code.
          p = Path("agent/public/index.html")
          s = p.read_text()
          s = s.replace("2.0.0-alpha.3 · 本机控制台", "2.0.0-alpha.13 · 本机控制台")
          old_state = "let settings=null,lastChatCount=0,lastLogs='';"
          new_state = "let settings=null,lastChatCount=0,lastLogs='',lastOpenedMicrosoftCode='';"
          if old_state not in s:
              raise SystemExit("Dashboard 状态变量未匹配，停止构建")
          s = s.replace(old_state, new_state, 1)

          old_api = """async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-control-token':TOKEN},body:JSON.stringify(body??{})});const j=await r.json();if(!r.ok)throw new Error(j.error??'请求失败');return j;}"""
          new_api = """async function api(path,body){let r;try{r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-control-token':TOKEN},body:JSON.stringify(body??{})});}catch(e){throw new Error('内置 AI 服务未连接。请等待顶部显示“控制面板已就绪”后，再开始登录。');}let j;try{j=await r.json();}catch(e){throw new Error('本机控制服务返回了无效响应，请刷新或重新启动 AI 服务。');}if(!r.ok)throw new Error(j.error??'请求失败');return j;}"""
          if old_api not in s:
              raise SystemExit("Dashboard API 函数未匹配，停止构建")
          s = s.replace(old_api, new_api, 1)

          old_code = """if(s.deviceCode){$('deviceCode').style.display='block';$('verifyLink').href=s.deviceCode.verificationUri||'https://microsoft.com/link';$('codeValue').textContent=s.deviceCode.userCode||'';$('codeMessage').textContent=s.deviceCode.message||'在微软登录页面输入上方代码。'}else $('deviceCode').style.display='none';"""
          new_code = """if(s.deviceCode){
            $('deviceCode').style.display='block';
            const microsoftUrl=s.deviceCode.verificationUri||'https://www.microsoft.com/link';
            const microsoftCode=s.deviceCode.userCode||'';
            $('verifyLink').href=microsoftUrl;
            $('verifyLink').textContent='打开微软官方账号授权页面';
            $('codeValue').textContent=microsoftCode;
            $('codeMessage').textContent='正在调用 Microsoft/Xbox 官方设备授权。请在微软页面登录并输入上方代码；账号密码只在微软官方页面填写。';
            if(microsoftCode && microsoftCode!==lastOpenedMicrosoftCode){
              lastOpenedMicrosoftCode=microsoftCode;
              if(window.AndroidBridge && window.AndroidBridge.openMicrosoftLogin){
                window.AndroidBridge.openMicrosoftLogin(microsoftUrl);
              } else {
                window.location.assign(microsoftUrl);
              }
            }
          }else{
            $('deviceCode').style.display='none';
            lastOpenedMicrosoftCode='';
          }"""
          if old_code not in s:
              raise SystemExit("Dashboard 微软设备码显示逻辑未匹配，停止构建")
          s = s.replace(old_code, new_code, 1)

          p.write_text(s)
          PY

      - name: Use Minecraft Android Bedrock Xbox authentication identity
        working-directory: BlockmateAI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("agent/src/bedrock-transport.ts")
          s = p.read_text()

          old = "type FriendSession = Record<string, any>;"
          new = old + "\ntype XboxAccountInfo = { gamertag:string; uuid:string; xuid:string; userHash:string; titleId:string; platform:string; expiresAt:string; bedrockChainReady:boolean; multiplayerTokenReady:boolean };"
          if "type XboxAccountInfo" not in s:
              if old not in s: raise SystemExit("BedrockTransport account type anchor not found")
              s = s.replace(old, new, 1)

          old = "  private actualGamertag='';"
          new = old + "\n  private authInfo: XboxAccountInfo|null=null;"
          if "private authInfo: XboxAccountInfo|null=null;" not in s:
              if old not in s: raise SystemExit("BedrockTransport auth state anchor not found")
              s = s.replace(old, new, 1)

          old = "  getBotName():string { return this.actualGamertag || String(this.client?.profile?.name ?? this.client?.username ?? this.getSettings().server.username); }"
          new = old + "\n  getAuthInfo():XboxAccountInfo|null { return this.authInfo ? {...this.authInfo} : null; }"
          if "getAuthInfo():XboxAccountInfo|null" not in s:
              if old not in s: raise SystemExit("BedrockTransport auth getter anchor not found")
              s = s.replace(old, new, 1)

          old = "      version:settings.server.version,\n      offline:false,"
          new = "      version:settings.server.version,\n      authTitle:'0000000048183522',\n      deviceType:'Android',\n      deviceOS:1,\n      flow:'live',\n      offline:false,"
          if "authTitle:'0000000048183522'" not in s:
              if old not in s: raise SystemExit("Bedrock client Android auth option anchor not found")
              s = s.replace(old, new, 1)

          anchor = "\n\n    if(settings.server.mode==='realm') {"
          auth = """
          
              // Token material remains in the app-private cache; raw credentials are never returned to the AI API or UI.
              const authlib=require('prismarine-auth');
              const authflow=new authlib.Authflow(settings.server.username,this.authFolder,{
                flow:'live',
                authTitle:authlib.Titles.MinecraftAndroid,
                deviceType:'Android'
              },options.onMsaCode);
              options.authflow=authflow;
          """
          if "const authflow=new authlib.Authflow" not in s:
              if anchor not in s: raise SystemExit("Bedrock authflow injection anchor not found")
              s = s.replace(anchor, auth + anchor, 1)

          pattern = r"    client\.on\('login',\(\)=>\{[^\n]*\}\);"
          replacement = """    client.on('session',(profileData:any)=>{
              this.actualGamertag=String(client.profile?.name ?? client.username ?? '');
              const profile=profileData ?? client.profile ?? {};
              this.hooks.status('已获取 Minecraft Android Bedrock/Xbox 身份（' + (this.actualGamertag || '已登录') + '），正在完成服务器登录…');
              this.hooks.log('Android Bedrock 账号：Gamertag=' + (this.actualGamertag || 'unknown') + '；XUID=' + String(profile.xuid ?? 'unknown') + '；UUID=' + String(profile.uuid ?? 'unknown'));
              void authflow.getXboxToken('https://multiplayer.minecraft.net/').then((xsts:any)=>{
                const expires=new Date(xsts.expiresOn);
                this.authInfo={
                  gamertag:this.actualGamertag || String(profile.name ?? ''),
                  uuid:String(profile.uuid ?? ''),
                  xuid:String(profile.xuid ?? xsts.userXUID ?? ''),
                  userHash:String(xsts.userHash ?? ''),
                  titleId:'0000000048183522',
                  platform:'Android',
                  expiresAt:Number.isNaN(expires.getTime()) ? String(xsts.expiresOn ?? '') : expires.toISOString(),
                  bedrockChainReady:Array.isArray(client.accessToken) && client.accessToken.length>=2,
                  multiplayerTokenReady:Boolean(client.multiplayerToken)
                };
                this.hooks.log('Xbox 会话信息已载入：XUID=' + this.authInfo.xuid + '；XSTS=' + Boolean(xsts.XSTSToken) + '；Bedrock 身份链=' + this.authInfo.bedrockChainReady + '；多人凭据=' + this.authInfo.multiplayerTokenReady);
              }).catch((error:any)=>this.hooks.log('读取 Xbox 会话元数据失败：' + (error instanceof Error ? error.message : String(error))));
            });"""
          s, count = re.subn(pattern, lambda _: replacement, s, count=1)
          if count != 1: raise SystemExit("Bedrock login listener anchor not found")
          p.write_text(s)

          p = Path("agent/src/main.ts")
          s = p.read_text()
          old = "return {status:currentStatus,running:r.running,goal:r.goal,errors:r.errors,connected:transport.isConnected(),world,deviceCode,worlds:friendWorlds,logs:chatLogs,systemLogs,aiAvailable:settings.ai.enabled&&ai.available,hasApiKey:Boolean(settings.ai.apiKey),botName:transport.getBotName()};"
          new = "return {status:currentStatus,running:r.running,goal:r.goal,errors:r.errors,connected:transport.isConnected(),world,deviceCode,worlds:friendWorlds,logs:chatLogs,systemLogs,aiAvailable:settings.ai.enabled&&ai.available,hasApiKey:Boolean(settings.ai.apiKey),botName:transport.getBotName(),authInfo:transport.getAuthInfo()};"
          if "authInfo:transport.getAuthInfo()" not in s:
              if old not in s: raise SystemExit("Dashboard state response anchor not found")
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("agent/src/dashboard.ts")
          s = p.read_text()
          old = "  worlds:FriendWorld[];logs:LogEntry[];systemLogs:string[];aiAvailable:boolean;hasApiKey:boolean;botName?:string;"
          new = old + "\n  authInfo:{gamertag:string;uuid:string;xuid:string;userHash:string;titleId:string;platform:string;expiresAt:string;bedrockChainReady:boolean;multiplayerTokenReady:boolean}|null;"
          if "authInfo:{gamertag:string" not in s:
              if old not in s: raise SystemExit("DashboardState auth info type anchor not found")
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("agent/public/index.html")
          s = p.read_text()
          old = '<div class="hint">使用 Microsoft 设备代码登录。要让 AI 成为第二名玩家，必须登录另一个拥有 Minecraft 权限的 Xbox 账号；游戏内显示该账号自己的 Gamertag。好友世界模式会列出当前账号可加入的 Xbox 好友会话；好友需在线且世界允许加入。Realm 模式则要求账号拥有或获邀加入该 Realm。</div><div id="deviceCode"'
          new = '<div class="field"><label>Android Bedrock / Xbox 登录身份</label><div id="xboxIdentity" class="log">等待 Microsoft/Xbox 登录…</div></div><div class="hint">使用 Minecraft Android 的 Title ID 与设备类型进行 Live/Xbox 身份验证。只显示账号元数据和凭据就绪状态，不显示原始令牌。</div><div class="hint">好友世界和 Realm 继续使用原有加入流程。</div><div id="deviceCode"'
          if 'id="xboxIdentity"' not in s:
              if old not in s: raise SystemExit("Dashboard Xbox identity UI anchor not found")
              s = s.replace(old, new, 1)

          pattern = r"if\(s\.botName\)\{\$\('runtimeMeta'\)\.textContent=\x60Gamertag：\$\{s\.botName\} · 运行错误 \$\{s\.errors\?\?0\}\x60;\}"
          replacement = """if(s.botName){$('runtimeMeta').textContent='Gamertag：'+s.botName+' · 运行错误 '+(s.errors??0);}
          const a=s.authInfo;
          $('xboxIdentity').textContent=a?[
            '登录平台：'+a.platform+' · Title ID：'+a.titleId,
            'Gamertag：'+a.gamertag,
            'XUID：'+a.xuid,
            '用户哈希：'+a.userHash,
            '玩家 UUID：'+a.uuid,
            'XSTS 有效期：'+a.expiresAt,
            'Bedrock 身份链：'+(a.bedrockChainReady?'已载入':'未载入')+' · 多人凭据：'+(a.multiplayerTokenReady?'已载入':'未载入')
          ].join('\\n'):'尚未完成 Xbox 登录；登录成功后会在这里显示 Gamertag、XUID 与会话状态。';"""
          s, count = re.subn(pattern, lambda _: replacement, s, count=1)
          if count != 1: raise SystemExit("Dashboard refresh auth metadata anchor not found")
          p.write_text(s)
          PY

      - name: Replace HTML dashboard with native Android Microsoft login and skin center
        working-directory: BlockmateAI-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          native = textwrap.dedent(r'''
          package com.blockmate.ai

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors

          class MainActivity : Activity() {
              companion object {
                  private const val API_ROOT = "http://127.0.0.1:8765"
                  private const val CONTROL_TOKEN = "blockmate-native-android-v2-2026"
                  private const val MINECRAFT_PACKAGE = "com.mojang.minecraftpe"
                  private const val REQUEST_SKIN = 841
              }

              private val handler = Handler(Looper.getMainLooper())
              private val io = Executors.newFixedThreadPool(4)
              private var serviceReady = false
              private var settingsLoaded = false
              private var settings = JSONObject()
              private var lastDeviceCode = ""
              private var stopping = false

              private lateinit var serviceStatus: TextView
              private lateinit var gameStatus: TextView
              private lateinit var accountStatus: TextView
              private lateinit var accountDetails: TextView
              private lateinit var worldsPanel: LinearLayout
              private lateinit var logsView: TextView
              private lateinit var hostInput: EditText
              private lateinit var portInput: EditText
              private lateinit var versionInput: EditText
              private lateinit var usernameInput: EditText
              private lateinit var modeSpinner: Spinner
              private lateinit var transportSpinner: Spinner
              private lateinit var apiUrlInput: EditText
              private lateinit var apiKeyInput: EditText
              private lateinit var modelInput: EditText
              private lateinit var autonomySwitch: Switch
              private lateinit var attackSwitch: Switch
              private lateinit var collectSwitch: Switch
              private lateinit var exploreSwitch: Switch
              private lateinit var eatSwitch: Switch
              private lateinit var chatInput: EditText
              private lateinit var skinPreview: ImageView

              private val pollTask = object : Runnable {
                  override fun run() {
                      if (stopping || isFinishing) return
                      refreshState()
                      handler.postDelayed(this, 1800)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(12, 25, 40)
                  window.navigationBarColor = Color.rgb(8, 17, 29)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 72)
                  }
                  buildUi()
                  startBackend()
                  handler.postDelayed(pollTask, 700)
              }

              private fun buildUi() {
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.rgb(9, 17, 29))
                      isFillViewport = true
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(18), dp(16), dp(34))
                  }
                  scroll.addView(root)
                  setContentView(scroll)

                  addText(root, "方块伙伴 AI 2.0", 27f, true, 0xFFF1F5F9.toInt())
                  addText(root, "Minecraft Bedrock 原生控制台 · Microsoft / Xbox", 13f, false, 0xFF94A3B8.toInt())

                  val serviceCard = card(root, "后台服务")
                  serviceStatus = addText(serviceCard, "后台服务正在启动…", 15f, true, 0xFFBAE6FD.toInt())
                  val serviceRow = row(serviceCard)
                  addButton(serviceRow, "启动 AI 服务", true) { startBackend() }
                  addButton(serviceRow, "停止服务", false) { stopBackend() }

                  val accountCard = card(root, "Microsoft / Xbox 账号")
                  accountStatus = addText(accountCard, "等待 Microsoft 登录", 18f, true, 0xFFF1F5F9.toInt())
                  accountDetails = addText(accountCard, "使用 Minecraft Android 对应的 Bedrock / Xbox 身份流程。登录码出现后会打开 Microsoft 官方授权页面。", 13f, false, 0xFF9CAEC2.toInt())
                  val accountRow = row(accountCard)
                  addButton(accountRow, "登录并加入世界", true) { connectGame() }
                  addButton(accountRow, "切换账号", false) { clearXboxCache() }
                  addText(accountCard, "账号密码只在 Microsoft 官方页面输入。本应用不会要求或保存微软密码，也不会向 AI API 发送 Xbox 令牌。", 12f, false, 0xFF8FA3BA.toInt())

                  val serverCard = card(root, "游戏连接")
                  gameStatus = addText(serverCard, "等待连接", 14f, true, 0xFFCBD5E1.toInt())
                  modeSpinner = addSpinner(serverCard, arrayOf("服务器 IP / 端口", "Xbox 好友世界", "Realm"))
                  hostInput = addEdit(serverCard, "服务器地址 / IP", "127.0.0.1")
                  val serverRow = row(serverCard)
                  portInput = addEdit(serverRow, "UDP 端口", "19132", false, 1f)
                  versionInput = addEdit(serverRow, "Bedrock 版本", "1.26.60", false, 1f)
                  usernameInput = addEdit(serverCard, "AI 玩家显示昵称", "BlockmateAI")
                  transportSpinner = addSpinner(serverCard, arrayOf("自动检测（推荐）", "RakNet", "NetherNet"))
                  val saveRow = row(serverCard)
                  addButton(saveRow, "保存连接设置", false) { saveSettings(false) }
                  addButton(saveRow, "断开游戏连接", false) { disconnectGame() }
                  worldsPanel = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  serverCard.addView(worldsPanel)

                  val skinCard = card(root, "Minecraft 皮肤与角色外观")
                  addText(skinCard, "打开 Minecraft 自带的角色创建器、经典皮肤、已拥有的皮肤包、披风和表情界面。", 13f, false, 0xFF9CAEC2.toInt())
                  skinPreview = ImageView(this).apply {
                      adjustViewBounds = true
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      visibility = android.view.View.GONE
                      background = rounded(0xFF0B1626.toInt(), 12)
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                  }
                  skinCard.addView(skinPreview, LinearLayout.LayoutParams(-1, dp(140)))
                  val skinRow = row(skinCard)
                  addButton(skinRow, "选择自定义皮肤 PNG", true) { chooseSkin() }
                  addButton(skinRow, "打开 Minecraft 皮肤中心", false) { openMinecraftProfile() }
                  addText(skinCard, "自定义 PNG 会保存到 Download/BlockmateAI/Skins。进入皮肤中心后，在经典皮肤中选择“导入”，再从下载目录选择文件。", 12f, false, 0xFF8FA3BA.toInt())

                  val aiCard = card(root, "AI 服务设置")
                  apiUrlInput = addEdit(aiCard, "AI API 地址（HTTPS）", "https://api.openai.com/v1")
                  apiKeyInput = addEdit(aiCard, "AI API Key（留空表示保留原密钥）", "", true)
                  modelInput = addEdit(aiCard, "模型名称", "gpt-4.1-mini")
                  val aiRow = row(aiCard)
                  addButton(aiRow, "保存 AI 设置", false) { saveSettings(false) }
                  addButton(aiRow, "测试 API", false) { testAi() }

                  val behaviorCard = card(root, "AI 行为")
                  autonomySwitch = addSwitch(behaviorCard, "自主生存")
                  attackSwitch = addSwitch(behaviorCard, "攻击敌对生物")
                  collectSwitch = addSwitch(behaviorCard, "收集掉落物")
                  exploreSwitch = addSwitch(behaviorCard, "主动探索")
                  eatSwitch = addSwitch(behaviorCard, "饥饿时进食")
                  addButton(behaviorCard, "保存行为设置", true) { saveSettings(false) }

                  val chatCard = card(root, "游戏聊天与运行日志")
                  chatInput = addEdit(chatCard, "发送给游戏内 AI 玩家", "")
                  addButton(chatCard, "发送聊天", true) { sendChat() }
                  logsView = addText(chatCard, "等待后台日志…", 12f, false, 0xFF9CAEC2.toInt())
                  addText(root, "2.0.0-alpha.10 · 原生 Android 界面，官方 Microsoft 登录内嵌", 11f, false, 0xFF64748B.toInt())
              }

              private fun card(parent: LinearLayout, title: String): LinearLayout {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(15), dp(14), dp(15), dp(15))
                      background = rounded(0xFF17263A.toInt(), 18)
                  }
                  val lp = LinearLayout.LayoutParams(-1, -2)
                  lp.topMargin = dp(14)
                  parent.addView(box, lp)
                  addText(box, title, 18f, true, 0xFFF1F5F9.toInt())
                  return box
              }

              private fun row(parent: LinearLayout): LinearLayout {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  parent.addView(r, LinearLayout.LayoutParams(-1, -2))
                  return r
              }

              private fun addText(parent: LinearLayout, value: String, size: Float, bold: Boolean, color: Int): TextView {
                  val view = TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, dp(5), 0, dp(7))
                  }
                  parent.addView(view, LinearLayout.LayoutParams(-1, -2))
                  return view
              }

              private fun addEdit(parent: LinearLayout, hint: String, value: String, password: Boolean = false, weight: Float = 0f): EditText {
                  val field = EditText(this).apply {
                      this.hint = hint
                      setText(value)
                      textSize = 14f
                      setTextColor(0xFFF1F5F9.toInt())
                      setHintTextColor(0xFF8293A8.toInt())
                      setSingleLine(true)
                      inputType = if (password) {
                          android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD
                      } else {
                          android.text.InputType.TYPE_CLASS_TEXT
                      }
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      background = rounded(0xFF0D1929.toInt(), 11, 0xFF34465D.toInt())
                  }
                  val lp = LinearLayout.LayoutParams(if (weight > 0f) 0 else -1, dp(52), if (weight > 0f) weight else 0f)
                  lp.topMargin = dp(5)
                  lp.bottomMargin = dp(6)
                  if (weight > 0f) lp.marginEnd = dp(6)
                  parent.addView(field, lp)
                  return field
              }

              private fun addSpinner(parent: LinearLayout, items: Array<String>): Spinner {
                  val spinner = Spinner(this)
                  val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_item, items)
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  spinner.adapter = adapter
                  parent.addView(spinner, LinearLayout.LayoutParams(-1, dp(48)))
                  return spinner
              }

              private fun addSwitch(parent: LinearLayout, label: String): Switch {
                  val sw = Switch(this).apply {
                      text = label
                      textSize = 14f
                      setTextColor(0xFFE2E8F0.toInt())
                      isChecked = true
                      setPadding(0, dp(4), 0, dp(4))
                  }
                  parent.addView(sw, LinearLayout.LayoutParams(-1, -2))
                  return sw
              }

              private fun addButton(parent: LinearLayout, label: String, primary: Boolean, action: () -> Unit) {
                  val button = Button(this).apply {
                      text = label
                      textSize = 13f
                      isAllCaps = false
                      setTextColor(if (primary) Color.rgb(8, 24, 35) else 0xFFE2E8F0.toInt())
                      background = rounded(if (primary) 0xFF62D2B5.toInt() else 0xFF293C54.toInt(), 12)
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                      setOnClickListener { action() }
                  }
                  val horizontal = parent.orientation == LinearLayout.HORIZONTAL
                  val lp = LinearLayout.LayoutParams(if (horizontal) 0 else -1, dp(48), if (horizontal) 1f else 0f)
                  lp.topMargin = dp(5)
                  lp.bottomMargin = dp(5)
                  if (horizontal) lp.marginEnd = dp(6)
                  parent.addView(button, lp)
              }

              private fun rounded(color: Int, radius: Int, stroke: Int = 0): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                      if (stroke != 0) setStroke(dp(1), stroke)
                  }
              }

              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()

              private fun startBackend() {
                  try {
                      ContextCompat.startForegroundService(this, Intent(this, AgentService::class.java))
                      serviceStatus.text = "后台服务启动中…"
                  } catch (e: Exception) {
                      serviceStatus.text = "后台服务启动失败：" + (e.message ?: "未知错误")
                  }
              }

              private fun stopBackend() {
                  stopService(Intent(this, AgentService::class.java))
                  serviceReady = false
                  serviceStatus.text = "后台服务已停止"
                  gameStatus.text = "已停止"
              }

              private fun refreshState() {
                  api("GET", "/api/state", null, 8000, false) { result, error ->
                      if (result == null) {
                          serviceReady = false
                          serviceStatus.text = "后台服务未就绪：" + (error ?: "正在启动")
                          return@api
                      }
                      serviceReady = true
                      serviceStatus.text = "后台服务已启动 · 原生控制接口正常"
                      if (!settingsLoaded) loadSettings()
                      updateState(result)
                  }
              }

              private fun loadSettings() {
                  api("GET", "/api/settings", null, 8000, false) { result, _ ->
                      if (result != null) {
                          settings = result
                          settingsLoaded = true
                          populateSettings(result)
                      }
                  }
              }

              private fun populateSettings(value: JSONObject) {
                  val server = value.optJSONObject("server") ?: JSONObject()
                  hostInput.setText(server.optString("host", "127.0.0.1"))
                  portInput.setText(server.optString("port", "19132"))
                  versionInput.setText(server.optString("version", "1.26.60"))
                  usernameInput.setText(server.optString("username", "BlockmateAI"))
                  modeSpinner.setSelection(when (server.optString("mode", "address")) {
                      "friendWorld" -> 1
                      "realm" -> 2
                      else -> 0
                  })
                  transportSpinner.setSelection(when (server.optString("transport", "auto")) {
                      "raknet" -> 1
                      "nethernet" -> 2
                      else -> 0
                  })
                  val ai = value.optJSONObject("ai") ?: JSONObject()
                  apiUrlInput.setText(ai.optString("baseUrl", "https://api.openai.com/v1"))
                  apiKeyInput.setText("")
                  modelInput.setText(ai.optString("model", "gpt-4.1-mini"))
                  val behavior = value.optJSONObject("behavior") ?: JSONObject()
                  autonomySwitch.isChecked = behavior.optBoolean("autonomy", true)
                  attackSwitch.isChecked = behavior.optBoolean("attackHostiles", true)
                  collectSwitch.isChecked = behavior.optBoolean("collectDrops", true)
                  exploreSwitch.isChecked = behavior.optBoolean("explore", true)
                  eatSwitch.isChecked = behavior.optBoolean("eatWhenHungry", true)
              }

              private fun settingsPayload(): JSONObject {
                  val next = JSONObject(settings.toString())
                  val server = next.optJSONObject("server") ?: JSONObject()
                  server.put("mode", when (modeSpinner.selectedItemPosition) {
                      1 -> "friendWorld"
                      2 -> "realm"
                      else -> "address"
                  })
                  server.put("host", hostInput.text.toString().trim())
                  server.put("port", portInput.text.toString().trim().toIntOrNull() ?: 19132)
                  server.put("version", versionInput.text.toString().trim().ifBlank { "1.26.60" })
                  server.put("username", usernameInput.text.toString().trim().ifBlank { "BlockmateAI" })
                  server.put("transport", when (transportSpinner.selectedItemPosition) {
                      1 -> "raknet"
                      2 -> "nethernet"
                      else -> "auto"
                  })
                  next.put("server", server)

                  val ai = next.optJSONObject("ai") ?: JSONObject()
                  ai.put("baseUrl", apiUrlInput.text.toString().trim())
                  ai.put("apiKey", apiKeyInput.text.toString().trim())
                  ai.put("model", modelInput.text.toString().trim().ifBlank { "gpt-4.1-mini" })
                  next.put("ai", ai)

                  val behavior = next.optJSONObject("behavior") ?: JSONObject()
                  behavior.put("autonomy", autonomySwitch.isChecked)
                  behavior.put("attackHostiles", attackSwitch.isChecked)
                  behavior.put("collectDrops", collectSwitch.isChecked)
                  behavior.put("explore", exploreSwitch.isChecked)
                  behavior.put("eatWhenHungry", eatSwitch.isChecked)
                  next.put("behavior", behavior)
                  settings = next
                  return next
              }

              private fun saveSettings(connectAfter: Boolean) {
                  if (!serviceReady) {
                      toast("后台服务尚未就绪，请先启动服务")
                      return
                  }
                  api("POST", "/api/settings", settingsPayload()) { result, error ->
                      if (error != null) {
                          toast("保存失败：" + error)
                      } else {
                          toast(result?.optString("message", "设置已保存") ?: "设置已保存")
                          if (connectAfter) beginConnection()
                      }
                  }
              }

              private fun connectGame() {
                  saveSettings(true)
              }

              private fun beginConnection() {
                  gameStatus.text = "正在启动 Minecraft Android / Xbox 官方身份验证…"
                  api("POST", "/api/connect", JSONObject(), 240000) { result, error ->
                      if (error != null) gameStatus.text = "连接未完成：" + error
                      else gameStatus.text = result?.optString("message", "连接请求已完成") ?: "连接请求已完成"
                  }
              }

              private fun disconnectGame() {
                  api("POST", "/api/disconnect", JSONObject()) { _, error ->
                      gameStatus.text = if (error == null) "已断开游戏连接" else "断开失败：" + error
                  }
              }

              private fun clearXboxCache() {
                  AlertDialog.Builder(this)
                      .setTitle("切换 Microsoft / Xbox 账号")
                      .setMessage("这会断开 AI 玩家并清除本应用自己的 Xbox 登录缓存，不会退出 Minecraft 游戏本身的账号。")
                      .setPositiveButton("清除并重新登录") { _, _ ->
                          api("POST", "/api/auth/signout", JSONObject(), 30000) { _, error ->
                              if (error == null) {
                                  lastDeviceCode = ""
                                  accountStatus.text = "本应用登录缓存已清除"
                                  accountDetails.text = "下次连接时会重新打开 Microsoft 官方授权页面。"
                                  toast("已清除本应用的 Xbox 登录缓存")
