                  }
                  panel.addView(status)

                  val browser = Button(this).apply {
                      text = "在系统浏览器中打开官方页面"
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(37, 54, 75))
                      setOnClickListener {
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(verificationUri)))
