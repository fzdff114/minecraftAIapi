name: Build and publish Blockmate APK Injector

on:
  push:
    branches: ["feature/apk-injector"]
    paths:
      - "tools/injector-source/**"
      - ".github/workflows/build-apk-injector.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: "35"
  BUILD_TOOLS: "35.0.0"
  SOURCE_SHA256: "30610a50dee53c98efcfb2f371409f2007af825ab0be507ee33134bb20452a46"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-${ANDROID_PLATFORM}" "build-tools;${BUILD_TOOLS}"

      - name: Restore and verify injector source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          cat tools/injector-source/part-*.b64 > .ci/injector.b64
          base64 --decode .ci/injector.b64 > .ci/injector.zip
          echo "${SOURCE_SHA256}  .ci/injector.zip" | sha256sum --check -
          test "$(stat -c%s .ci/injector.zip)" -eq 33482
          unzip -t .ci/injector.zip
          unzip -q .ci/injector.zip -d .
          test -f BlockmateAPKInjector/app/build.gradle
          test -f BlockmateAPKInjector/patchdex/src/main/java/com/blockmate/injected/AiActivity.java
          grep -q "configureSecureXmlFactory" BlockmateAPKInjector/app/src/main/java/com/fzdff/apkpatcher/MinecraftPatcher.java
          grep -q "InitProvider" BlockmateAPKInjector/app/src/main/java/com/fzdff/apkpatcher/MinecraftPatcher.java
          grep -q "registerActivityLifecycleCallbacks" BlockmateAPKInjector/patchdex/src/main/java/com/blockmate/injected/InitProvider.java
          grep -q "copyPatchDexAssets" BlockmateAPKInjector/app/src/main/java/com/fzdff/apkpatcher/MinecraftPatcher.java
          grep -q "requireAnyEntryContains" BlockmateAPKInjector/app/src/main/java/com/fzdff/apkpatcher/MinecraftPatcher.java
          grep -q "versionName .0.1.3." BlockmateAPKInjector/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path("BlockmateAPKInjector/app/build.gradle")
          s = p.read_text()
          old = "'META-INF/INDEX.LIST'"
          new = "'META-INF/INDEX.LIST', 'META-INF/versions/**'"
          if "META-INF/versions/**" not in s:
              if old not in s:
                  raise SystemExit("Cannot locate Gradle metadata exclusions")
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Build Android-compatible Apktool engine
        working-directory: BlockmateAPKInjector
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.0.0 https://github.com/anirudhmalik/apktool-android.git _deps/apktool-android
          cd _deps/apktool-android
          ./gradlew --no-daemon :brut.apktool:apktool-android:assembleRelease :brut.apktool:apktool-android:collectRuntimeJars
          cd "$GITHUB_WORKSPACE/BlockmateAPKInjector"
          mkdir -p app/libs/apktool/runtime
          cp _deps/apktool-android/brut.apktool/apktool-android/build/outputs/aar/apktool-android-release.aar app/libs/apktool-android-1.0.0.aar
          cp _deps/apktool-android/brut.apktool/apktool-android/build/libs-bundle/*.jar app/libs/apktool/runtime/
          test -s app/libs/apktool-android-1.0.0.aar
          test "$(find app/libs/apktool/runtime -name '*.jar' | wc -l)" -gt 5

      - name: Build and extract real patch DEX files
        working-directory: BlockmateAPKInjector
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :patchdex:assembleDebug
          mkdir -p app/src/main/assets/patch
          python3 - <<'PY'
          import re
          import zipfile
          from pathlib import Path

          apk = Path("patchdex/build/outputs/apk/debug/patchdex-debug.apk")
          out = Path("app/src/main/assets/patch")
          required = [
              b"Lcom/blockmate/injected/InitProvider;",
              b"Lcom/blockmate/injected/AiActivity;",
              b"Lcom/blockmate/injected/OverlayHook;",
          ]
          for old in out.glob("classes*.dex"):
              old.unlink()
          with zipfile.ZipFile(apk) as z:
              names = [n for n in z.namelist() if re.fullmatch(r"classes(?:[0-9]+)?\.dex", n)]
              names.sort(key=lambda n: 1 if n == "classes.dex" else int(re.search(r"classes([0-9]+)", n).group(1)))
              valid = []
              print("Patch APK DEX inventory:")
              for name in names:
                  data = z.read(name)
                  magic_ok = data.startswith(b"dex\n")
                  print(f"  {name}: {len(data)} bytes, dex_magic={magic_ok}")
                  # Empty placeholder DEX files are deliberately ignored.
                  if len(data) >= 1024 and magic_ok:
                      valid.append((name, data))
          if not valid:
              raise SystemExit("No non-empty DEX files in patchdex-debug.apk")
          combined = b"".join(data for _, data in valid)
          missing = [m.decode() for m in required if m not in combined]
          if missing:
              raise SystemExit("Patch DEX missing required class descriptors: " + ", ".join(missing))
          for i, (source_name, data) in enumerate(valid, 1):
              destination = out / ("classes.dex" if i == 1 else f"classes{i}.dex")
              destination.write_bytes(data)
              print(f"Embedded {source_name} -> {destination.name}: {len(data)} bytes")
          (Path("patchdex-dex-inventory.txt")).write_text(
              "\n".join(f"{src} -> classes{' ' if i == 1 else i}.dex: {len(data)} bytes"
                           for i, (src, data) in enumerate(valid, 1)) + "\n"
          )
          PY
          test "$(find app/src/main/assets/patch -maxdepth 1 -name 'classes*.dex' -type f | wc -l)" -gt 0
          sha256sum app/src/main/assets/patch/classes*.dex

      - name: Build injector APK
        working-directory: BlockmateAPKInjector
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        working-directory: BlockmateAPKInjector
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          python3 - <<'PY'
          import re, zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          required = [
              b"Lcom/blockmate/injected/InitProvider;",
              b"Lcom/blockmate/injected/AiActivity;",
              b"Lcom/blockmate/injected/OverlayHook;",
          ]
          with zipfile.ZipFile(apk) as z:
              names = [n for n in z.namelist() if re.fullmatch(r"assets/patch/classes(?:[0-9]+)?\.dex", n)]
              if not names:
                  raise SystemExit("Final injector APK has no embedded patch DEX assets")
              payload = b""
              for n in names:
                  data = z.read(n)
                  if len(data) < 1024 or not data.startswith(b"dex\n"):
                      raise SystemExit(f"Invalid packaged DEX asset {n}: {len(data)} bytes")
                  print(f"Verified asset {n}: {len(data)} bytes")
                  payload += data
              missing = [m.decode() for m in required if m not in payload]
              if missing:
                  raise SystemExit("Final APK missing injected classes: " + ", ".join(missing))
          PY
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee injector.sha256
          ls -lh "$APK"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blockmate-APK-Injector-0.1.3
          path: |
            BlockmateAPKInjector/app/build/outputs/apk/debug/app-debug.apk
            BlockmateAPKInjector/injector.sha256
            BlockmateAPKInjector/patchdex-dex-inventory.txt
            BlockmateAPKInjector/patchdex/build/outputs/apk/debug/patchdex-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-injector-v0.1.3
          name: Blockmate APK Injector v0.1.3
          target_commitish: feature/apk-injector
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          files: |
            BlockmateAPKInjector/app/build/outputs/apk/debug/app-debug.apk
            BlockmateAPKInjector/injector.sha256
