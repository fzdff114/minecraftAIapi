name: Remove retired Blockmate AI alpha releases

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/cleanup-old-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-retired-releases:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RESET_PREVIOUS_RELEASES]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all old alpha releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t releases < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          printf 'Found %s old public releases.\n' "${#releases[@]}"
          for tag in "${releases[@]}"; do
            [ -n "$tag" ] || continue
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

          # Remove any old alpha tags that existed without a matching GitHub Release.
          mapfile -t tags < <(git ls-remote --refs origin 'refs/tags/blockmate-ai-2.0-alpha.*' | awk '{sub("refs/tags/", "", $2); print $2}')
          for tag in "${tags[@]}"; do
            [ -n "$tag" ] || continue
            echo "Deleting orphaned alpha tag: $tag"
            git push origin ":refs/tags/$tag"
          done

          remaining=$(gh release list --limit 1000 --json tagName --jq 'length')
          echo "Remaining releases: $remaining"
          test "$remaining" -eq 0
