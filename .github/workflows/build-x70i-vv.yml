name: Build X70i VV Compatibility Assistant
on:
  push:
    branches: [x70i-vv-helper]
    paths:
      - 'X70iVVCompat-src.tar.gz.b64'
      - '.github/workflows/build-x70i-vv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract source
        run: base64 -d X70iVVCompat-src.tar.gz.b64 | tar -xz
      - name: Build APK
        working-directory: X70iVVCompat
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: X70i-VV-Compat-Debug-APK
          path: X70iVVCompat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
